# Configuration des outils de qualité et du paquet, sur le modèle de sentiment-app.

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# E4, E7, E9, F : erreurs probables ; I : ordre des imports ; B : constructions à risque
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rag_agent", "api", "ui", "communs", "mesurer"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*", "sentence_transformers", "sentence_transformers.*", "groq", "groq.*",
          "pandas", "pandas.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# --- Le paquet ---------------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
dynamic = ["version"]
description = "Agent de recherche documentaire (RAG) sur le corpus PIAF : recherche, réponse sourcée, API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2",
    "chromadb>=0.5,<0.6",
    "sentence-transformers>=3.2,<3.3",   # l'index ne se relit qu'avec le modèle qui l'a construit
    "groq>=0.11,<0.12",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39,<1.40", "httpx>=0.27,<0.28"]

[project.scripts]
rag = "rag_agent.cli:main"

[tool.setuptools]
packages = ["rag_agent", "api", "ui"]   # ni les tests, ni les données, ni l'index, ni src/

[tool.setuptools.dynamic]
version = { attr = "rag_agent.__version__" }
