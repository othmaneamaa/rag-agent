# Le crochet : ruff et mypy avant chaque commit (pre-commit install, une fois par poste).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy rag_agent api
        language: system
        types: [python]
        pass_filenames: false
